<script data-field-replace>
(function(){
  var params=new URLSearchParams(window.location.search);
  var fields={};
  var paramMap={
    'first_name':'firstName','last_name':'lastName','full_name':'fullName',
    'email':'email','phone':'phone','company':'company',
    'city':'city','state':'state','country':'country'
  };
  var skipTags={'SCRIPT':1,'STYLE':1,'NOSCRIPT':1,'TEXTAREA':1,'CODE':1,'PRE':1};
  var hasUrlFields=false;
  for(var p in paramMap){
    var v=params.get(p);
    if(v){fields[paramMap[p]]=v;hasUrlFields=true;}
  }
  var contactId=params.get('contact_id');
  function esc(s){
    if(!s)return s;
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function doReplace(data){
    var r={};
    r['{{full_name}}']=esc(((data.firstName||'')+' '+(data.lastName||'')).trim()||((data.fullName||data.name)||''));
    r['{{first_name}}']=esc(data.firstName||(data.name?data.name.split(' ')[0]:'')||'');
    r['{{last_name}}']=esc(data.lastName||(data.name&&data.name.indexOf(' ')>-1?data.name.substring(data.name.indexOf(' ')+1):'')||'');
    r['{{email}}']=esc(data.email||'');
    r['{{phone}}']=esc(data.phone||'');
    r['{{company}}']=esc(data.company||'');
    r['{{city}}']=esc(data.city||'');
    r['{{state}}']=esc(data.state||'');
    r['{{country}}']=esc(data.country||'');
    r['{{date}}']=new Date().toLocaleDateString();
    r['{{time}}']=new Date().toLocaleTimeString();
    r['{{location}}']=[data.city,data.state,data.country].filter(Boolean).join(', ');
    r['{{tracking_id}}']=esc(data.trackingId||'');
    r['{{lastClickedProduct}}']=esc(data.lastClickedProduct||'');
    r['{{lastProductClickDate}}']=esc(data.lastProductClickDate||'');
    r['{{lastClickedProductPrice}}']=esc(data.lastClickedProductPrice||'');
    r['{{lastClickedProductURL}}']=esc(data.lastClickedProductURL||'');
    r['{{productsClickedCount}}']=esc(data.productsClickedCount||'0');
    r['{{ip_address}}']=esc(data.ipAddress||'');
    r['{{ip}}']=esc(data.ipAddress||'');
    if(data.customFields){
      for(var k in data.customFields){
        r['{{'+k+'}}']=esc(String(data.customFields[k]||''));
      }
    }
    params.forEach(function(v,k){
      if(!paramMap[k]&&k!=='contact_id'&&k!=='page_id'&&k.indexOf('utm_')!==0){
        r['{{'+k+'}}']=esc(v);
      }
    });
    var hasValues=false;
    for(var key in r){if(r[key]){hasValues=true;break;}}
    if(!hasValues)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode:function(n){
        var p=n.parentNode;
        if(p&&skipTags[p.nodeName])return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var node;
    while(node=walker.nextNode()){
      var txt=node.nodeValue;
      if(txt&&txt.indexOf('{{')>-1){
        var changed=txt;
        for(var ph in r){
          if(r[ph]&&changed.indexOf(ph)>-1){
            changed=changed.split(ph).join(r[ph]);
          }
        }
        if(changed!==txt)node.nodeValue=changed;
      }
    }
    var attrs=['value','placeholder','content','alt','title'];
    attrs.forEach(function(attr){
      var els=document.querySelectorAll('['+attr+'*="{{"]');
      for(var i=0;i<els.length;i++){
        var tag=els[i].tagName;
        if(skipTags[tag])continue;
        var val=els[i].getAttribute(attr);
        if(val){
          var nv=val;
          for(var ph in r){
            if(r[ph]&&nv.indexOf(ph)>-1){
              nv=nv.split(ph).join(r[ph]);
            }
          }
          if(nv!==val)els[i].setAttribute(attr,nv);
        }
      }
    });
  }
  function run(){
    if(contactId){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://app.calldirector.ai/api/landing/context/'+encodeURIComponent(contactId)+'?page_id=7753');
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var resp=JSON.parse(xhr.responseText);
            if(resp.success&&resp.contact){
              var merged=resp.contact;
              for(var k in fields){merged[k]=fields[k];}
              doReplace(merged);
              return;
            }
          }catch(e){}
        }
        if(hasUrlFields)doReplace(fields);
      };
      xhr.onerror=function(){if(hasUrlFields)doReplace(fields);};
      xhr.send();
    }else if(hasUrlFields){
      doReplace(fields);
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
</script>

        <div class="f"><label for="st" data-i18n="street">Street address</label><input id="st" autocomplete="street-address"></div>
        <div class="grid three">
          <div class="f"><label for="ct" data-i18n="city">City</label><input id="ct" autocomplete="address-level2"></div>
          <div class="f"><label for="sa" data-i18n="state">State</label><input id="sa" autocomplete="address-level1" placeholder="MN" maxlength="2"></div>
          <div class="f"><label for="zp" data-i18n="zip">ZIP</label><input id="zp" autocomplete="postal-code" inputmode="numeric" placeholder="55401"></div>
        </div>
        <div class="f"><label for="ac"><span data-i18n="access">Access notes</span> <span data-i18n="opt">(optional)</span></label><input id="ac" data-ph="access_ph" placeholder="Gate code, call on arrival, ring bell…"></div>
      </fieldset>
      <fieldset><legend data-i18n="l3">When</legend>
        <div class="grid two">
          <div class="f"><label for="dt" data-i18n="date">Preferred date</label><input id="dt" type="date"></div>
          <div class="f"><label for="tm" data-i18n="time">Preferred time</label>
            <select id="tm"><option value="" data-i18n="choose">Choose…</option><option value="Morning" data-i18n="morning">Morning</option><option value="Afternoon" data-i18n="afternoon">Afternoon</option><option value="Evening" data-i18n="evening">Evening</option></select></div>
        </div>
      </fieldset>
      <fieldset><legend data-i18n="l4">What we're picking up</legend>
        <div class="grid two">
          <div class="f"><label for="pc" data-i18n="count">Number of packages</label><input id="pc" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
          <div class="f"><label for="pd" data-i18n="desc">What's inside (roughly)</label><input id="pd" data-ph="desc_ph" placeholder="Clothes, a laptop, shoes…"></div>
        </div>
        <div class="f"><label for="nt"><span data-i18n="notes">Anything else we should know?</span> <span data-i18n="opt">(optional)</span></label><textarea id="nt"></textarea></div>
      </fieldset>
      <div class="hp" aria-hidden="true"><label>Website</label><input id="web" tabindex="-1" autocomplete="off"></div>
      <p class="note" data-i18n="fee">We'll confirm the pickup fee when we contact you. No payment is taken on this page.</p>
      <button class="btn gold" type="submit" id="go" data-i18n="send">Request pickup</button>
    </form>
  </div>
  <div id="doneview" style="display:none"></div>
</main>

<script>
var WEBHOOK="https://app.calldirector.ai/api/webhooks/flow/6459/98c55ef3a167bc353087239525fe0584c23faa769a1a0bf1ccd80b4031ad29c1";
var WHATSAPP_NUMBER="16127565212"; // TODO: confirm which A2F number is on WhatsApp
var PHONE_TEL="+16127565212";
function siteRoot(){var h=location.hostname,p=location.pathname.split("/").filter(Boolean);return /github\.io$/.test(h)?"/"+(p[0]||"")+"/":"/";}
function routes(sc){(sc||document).querySelectorAll("[data-route]").forEach(function(a){a.href=siteRoot()+a.getAttribute("data-route");});}
routes();

var T={
en:{back:"← Back to home",eyebrow:"Pickup",h1:"Schedule a pickup",sub:"Tell us where and when. We'll contact you to confirm the date, time and any pickup fee.",
 l1:"About you",name:"Full name",email:"Email",phone:"Phone",l2:"Pickup address",street:"Street address",city:"City",state:"State",zip:"ZIP",access:"Access notes",opt:"(optional)",access_ph:"Gate code, call on arrival, ring bell…",
 l3:"When",date:"Preferred date",time:"Preferred time",choose:"Choose…",morning:"Morning",afternoon:"Afternoon",evening:"Evening",
 l4:"What we're picking up",count:"Number of packages",desc:"What's inside (roughly)",desc_ph:"Clothes, a laptop, shoes…",notes:"Anything else we should know?",
 fee:"We'll confirm the pickup fee when we contact you. No payment is taken on this page.",send:"Request pickup",sending:"Sending…",
 e_name:"Please add your name.",e_email:"Please add a valid email so we can confirm.",e_phone:"Please add a phone number so we can reach you.",e_addr:"Please complete the pickup address.",e_date:"Please choose a date (today or later).",e_time:"Please choose a time.",e_desc:"Please tell us roughly what's inside.",
 e_fail:"Sorry, that didn't go through. Please try again, or reach us directly:",
 done_h:"Pickup request received!",done_p:"A confirmation is on its way to {email}. We'll contact you to confirm the details.",
 wa_btn:"Chat on WhatsApp",track:"Track a package",home:"Back to home",wamsg:"Hello A2F Group, I just requested a pickup and have a question."},
fr:{back:"← Retour à l'accueil",eyebrow:"Enlèvement",h1:"Planifier un enlèvement",sub:"Dites-nous où et quand. Nous vous contacterons pour confirmer la date, l'heure et les frais d'enlèvement éventuels.",
 l1:"Vos coordonnées",name:"Nom complet",email:"E-mail",phone:"Téléphone",l2:"Adresse d'enlèvement",street:"Adresse",city:"Ville",state:"État",zip:"Code postal",access:"Précisions d'accès",opt:"(facultatif)",access_ph:"Code du portail, appelez en arrivant, sonnez…",
 l3:"Quand",date:"Date souhaitée",time:"Heure souhaitée",choose:"Choisir…",morning:"Matin",afternoon:"Après-midi",evening:"Soir",
 l4:"Ce que nous récupérons",count:"Nombre de colis",desc:"Contenu (approximatif)",desc_ph:"Vêtements, un ordinateur, des chaussures…",notes:"Autre chose à nous dire ?",
 fee:"Nous confirmerons les frais d'enlèvement en vous contactant. Aucun paiement n'est demandé sur cette page.",send:"Demander l'enlèvement",sending:"Envoi…",
 e_name:"Veuillez indiquer votre nom.",e_email:"Veuillez indiquer un e-mail valide pour la confirmation.",e_phone:"Veuillez indiquer un numéro pour que nous puissions vous joindre.",e_addr:"Veuillez compléter l'adresse d'enlèvement.",e_date:"Veuillez choisir une date (aujourd'hui ou plus tard).",e_time:"Veuillez choisir une heure.",e_desc:"Veuillez indiquer approximativement le contenu.",
 e_fail:"Désolé, l'envoi n'a pas abouti. Réessayez, ou contactez-nous directement :",
 done_h:"Demande d'enlèvement reçue !",done_p:"Une confirmation est en route vers {email}. Nous vous contacterons pour confirmer les détails.",
 wa_btn:"Écrire sur WhatsApp",track:"Suivre un colis",home:"Retour à l'accueil",wamsg:"Bonjour A2F Group, je viens de demander un enlèvement et j'ai une question."}
};
var lang="en";try{lang=localStorage.getItem("a2f_lang")||((navigator.language||"").slice(0,2)==="fr"?"fr":"en");}catch(e){}
function t(k){return (T[lang]||T.en)[k]||k;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function setLang(l){
  lang=l;try{localStorage.setItem("a2f_lang",l);}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"));});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=t(el.getAttribute("data-ph"));});
  document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-lang")===l);});
  if(window.__done)renderDone();
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"));});});
var d=new Date(),pad=function(n){return n<10?"0"+n:n;};
document.getElementById("dt").min=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

function v(id){return document.getElementById(id).value.trim();}
function phoneE164(p){var s=String(p||"").replace(/[^\d+]/g,"");if(!s)return "";if(s.charAt(0)==="+")return "+"+s.replace(/\D/g,"");var n=s.replace(/\D/g,"");if(n.length===10)return "+1"+n;if(n.length===11&&n.charAt(0)==="1")return "+"+n;return n;}
function showErr(m,help){var e=document.getElementById("err");e.style.display="block";e.innerHTML=esc(m)+(help?' <a href="tel:'+PHONE_TEL+'">+1 (612) 756-5212</a> · <a href="https://wa.me/'+WHATSAPP_NUMBER+'" target="_blank" rel="noopener">WhatsApp</a>':'');e.scrollIntoView({behavior:"smooth",block:"center"});}

var SENT=null;
function renderDone(){
  document.getElementById("formview").style.display="none";
  var el=document.getElementById("doneview");el.style.display="block";
  var wa="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(t("wamsg"));
  el.innerHTML='<div class="done"><svg class="check" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40"/><path d="M26 43l11 11 21-23"/></svg><h1>'+esc(t("done_h"))+'</h1><p class="sub" style="margin-inline:auto">'+esc(t("done_p").replace("{email}",SENT.email))+'</p>'+
  '<div class="pills"><span class="pill">'+esc(SENT.date)+'</span><span class="pill">'+esc(t(SENT.time.toLowerCase()))+'</span><span class="pill">'+esc(SENT.count)+' ×</span></div>'+
  '<div class="cta"><a class="btn wa" href="'+wa+'" target="_blank" rel="noopener">'+esc(t("wa_btn"))+'</a><a class="btn line" data-route="track/" href="#">'+esc(t("track"))+'</a><a class="btn line" data-route="" href="#">'+esc(t("home"))+'</a></div></div>';
  routes(el);window.__done=true;window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  if(v("web")){SENT={email:v("em"),date:v("dt"),time:v("tm")||"Morning",count:v("pc")};renderDone();return;}
  var today=document.getElementById("dt").min;
  if(!v("nm"))return showErr(t("e_name"));
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("em")))return showErr(t("e_email"));
  if(v("ph").replace(/\D/g,"").length<7)return showErr(t("e_phone"));
  if(!v("st")||!v("ct")||!v("sa")||!v("zp"))return showErr(t("e_addr"));
  if(!v("dt")||v("dt")<today)return showErr(t("e_date"));
  if(!v("tm"))return showErr(t("e_time"));
  if(!v("pd"))return showErr(t("e_desc"));
  var btn=document.getElementById("go");btn.disabled=true;btn.textContent=t("sending");
  var addr=v("st")+", "+v("ct")+", "+v("sa").toUpperCase()+" "+v("zp");
  var body={contactName:v("nm"),contactEmail:v("em"),contactPhone:phoneE164(v("ph")),
   data:{pickup_address:addr,access_notes:v("ac"),preferred_date:v("dt"),preferred_time:v("tm"),package_count:v("pc")||"1",package_description:v("pd"),notes:v("nt"),language:lang,source:"website-pickup-request"}};
  fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);SENT={email:v("em"),date:v("dt"),time:v("tm"),count:v("pc")||"1"};renderDone();})
   .catch(function(){btn.disabled=false;btn.textContent=t("send");showErr(t("e_fail"),true);});
});
setLang(lang);
</script>
</body>
</html>
